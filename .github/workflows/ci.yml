name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: dhara_test
                    POSTGRES_USER: dhara
                    POSTGRES_PASSWORD: dhara
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U dhara -d dhara_test"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            DHARA_TEST_DATABASE_URL: postgres://dhara:dhara@localhost:5433/dhara_test?sslmode=disable

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: gofmt
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                    echo "Unformatted files:"; echo "$unformatted"; exit 1
                  fi

            - name: vet
              run: go vet ./...

            - name: build
              run: go build ./...

            - name: test
              run: go test ./... -p 1 -race -shuffle=on -timeout=600s
