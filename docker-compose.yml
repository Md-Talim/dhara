services:
    db:
        container_name: dhara_db
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: dhara
            POSTGRES_USER: dhara
            POSTGRES_PASSWORD: dhara
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U dhara -d dhara"]
            interval: 5s
            timeout: 3s
            retries: 5

    test_db:
        container_name: dhara_db_test
        image: postgres:16-alpine
        restart: no
        environment:
            POSTGRES_DB: dhara_test
            POSTGRES_USER: dhara
            POSTGRES_PASSWORD: dhara
        ports:
            - "5433:5432"
        volumes:
            - pgdata_test:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U dhara -d dhara_test"]
            interval: 5s
            timeout: 3s
            retries: 5

    # One-shot migrator: applies pending migrations, then exits 0.
    # server and worker start only after it completes successfully.
    migrate:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                BINARY: migrate
        environment:
            DHARA_DATABASE_URL: postgres://dhara:dhara@db:5432/dhara?sslmode=disable
        depends_on:
            db:
                condition: service_healthy
        restart: "no"

    server:
        container_name: dhara_server
        build:
            context: .
            dockerfile: Dockerfile
            args:
                BINARY: server
        ports:
            - "8080:8080"
        environment:
            DHARA_DATABASE_URL: postgres://dhara:dhara@db:5432/dhara?sslmode=disable
            AUTO_MIGRATE: "false"
            PORT: "8080"
        depends_on:
            migrate:
                condition: service_completed_successfully
        restart: unless-stopped

    worker:
        container_name: dhara_worker
        build:
            context: .
            dockerfile: Dockerfile
            args:
                BINARY: worker
        environment:
            DHARA_DATABASE_URL: postgres://dhara:dhara@db:5432/dhara?sslmode=disable
            AUTO_MIGRATE: "false"
        depends_on:
            migrate:
                condition: service_completed_successfully
        restart: unless-stopped

volumes:
    pgdata:
    pgdata_test:
